name: pstack skills

# Publishes chhoumann/t3-pstack's newest release as the archives a host's
# provisioning.skills `url` entries follow (scripts/pstack/README.md).
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pstack-skills
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish pstack skills
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      TAG: pstack-skills
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          set -eu
          git clone --quiet https://github.com/chhoumann/t3-pstack.git "$RUNNER_TEMP/t3-pstack"
          # Releases only, never main. The suffix setting sorts v2.0.0-rc.3 before v2.0.0.
          release="$(git -C "$RUNNER_TEMP/t3-pstack" -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n1)"
          built="$(scripts/pstack/build.sh "$RUNNER_TEMP/t3-pstack" "$release" "$RUNNER_TEMP/build")"
          read -r version commit <<<"$built"
          mkdir -p "$RUNNER_TEMP/assets"
          # Byte-identical archives for identical skills, so hosts swap only on a real change.
          pack() { tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C "$1" . | gzip -n > "$2"; }
          pack "$RUNNER_TEMP/build/skills" "$RUNNER_TEMP/assets/pstack-skills.tgz"
          # Claude and Codex read the same skills. The second name keeps hosts that list one archive per agent working.
          cp "$RUNNER_TEMP/assets/pstack-skills.tgz" "$RUNNER_TEMP/assets/pstack-codex-skills.tgz"
          cd "$RUNNER_TEMP/assets"
          jq -n --arg version "$version" --arg release "$release" --arg commit "$commit" --arg fork "$GITHUB_SHA" \
            --arg skills "$(sha256sum pstack-skills.tgz | cut -d' ' -f1)" \
            '{version: $version, t3PstackRelease: $release, t3PstackCommit: $commit, forkCommit: $fork, sha256: {"pstack-skills.tgz": $skills, "pstack-codex-skills.tgz": $skills}}' \
            > pstack-skills.json
          cat pstack-skills.json
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$(printf 'pstack from chhoumann/t3-pstack %s (%s), built by scripts/pstack/build.sh at %s. Replaced by the pstack skills workflow.' "$RELEASE" "$COMMIT" "$GITHUB_SHA")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --title "pstack skills" --notes "$notes"
          fi
          gh release upload "$TAG" --clobber "$RUNNER_TEMP"/assets/*
