# Publishes the runtime artifacts as release assets, so the AWS provisioning
# host image can download them and pin them by sha256. The linux/amd64 one
# ships node_modules for E2B. The lockfile one has none, and a Namespace Mac
# runs `npm ci` against it.
name: Runtime artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "runtime-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish runtime artifacts
    if: github.repository == 'andrewcai8/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # t3#build depends on @t3tools/web#build and copies it into dist/client.
      # It only warns when the web build is missing, so check the result.
      - name: Build server and web client
        run: |
          vp run --filter t3 build
          test -f apps/server/dist/client/index.html

      # --platform compiles node-pty inside a linux/amd64 container.
      - name: Build runtime artifact
        run: node apps/server/scripts/build-runtime-artifact.ts runtime-linux-amd64.tar.gz --install --platform=linux/amd64

      - name: Build lockfile runtime artifact
        run: node apps/server/scripts/build-runtime-artifact.ts runtime-lockfile.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum runtime-linux-amd64.tar.gz > runtime-linux-amd64.tar.gz.sha256
          sha256sum runtime-lockfile.tar.gz > runtime-lockfile.tar.gz.sha256
          linux_sha256="$(cut -d ' ' -f 1 runtime-linux-amd64.tar.gz.sha256)"
          lockfile_sha256="$(cut -d ' ' -f 1 runtime-lockfile.tar.gz.sha256)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="runtime-${GITHUB_SHA::7}"
          fi
          gh release create "$tag" \
            runtime-linux-amd64.tar.gz \
            runtime-linux-amd64.tar.gz.sha256 \
            runtime-lockfile.tar.gz \
            runtime-lockfile.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$(printf 'Runtime artifacts.\n\n- revision: `%s`\n- runtime-linux-amd64.tar.gz sha256: `%s`\n- runtime-lockfile.tar.gz sha256: `%s`\n' "$GITHUB_SHA" "$linux_sha256" "$lockfile_sha256")"
