name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Merge pingdotgg/t3code into this fork
    runs-on: ubuntu-24.04
    steps:
      - name: Merge upstream into the default branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if gh api --method POST "repos/${GH_REPO}/merge-upstream" -f branch="$BRANCH"; then
            echo "Merged pingdotgg/t3code into ${BRANCH}."
            exit 0
          fi
          hint=$(cat <<EOF
          GitHub could not merge upstream into ${BRANCH}.
          This fork's ${BRANCH} has unique commits that conflict with pingdotgg/t3code.
          Do not force-reset ${BRANCH}. That would drop this fork's work.
          Resolve locally:
            git fetch upstream
            git checkout -b sync/upstream origin/${BRANCH}
            git merge upstream/${BRANCH}
          If upstream changed GitHub Actions files, FORK_SYNC_TOKEN needs the workflow scope.
          EOF
          )
          echo "$hint" >&2
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "hint<<HINT" >> "$GITHUB_OUTPUT"
          echo "$hint" >> "$GITHUB_OUTPUT"
          echo "HINT" >> "$GITHUB_OUTPUT"
          exit 1

      # A failed sync is otherwise silent. One open issue collects every failed
      # day, so the fork cannot drift unnoticed and the issue never duplicates.
      - name: Report a failed sync
        if: failure() && steps.merge.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HINT: ${{ steps.merge.outputs.hint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title="Upstream sync needs a manual merge"
          body=$(printf '%s: the daily upstream sync failed ([run](%s)).\n\n```\n%s\n```\n' \
            "$(date -u +%Y-%m-%d)" "$RUN_URL" "$HINT")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
