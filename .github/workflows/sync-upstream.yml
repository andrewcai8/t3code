name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# main is protected, so upstream arrives as a pull request merged with a merge
# commit, never a squash: later syncs then share history with pingdotgg/t3code.
jobs:
  sync:
    name: Open a pull request merging pingdotgg/t3code
    runs-on: ubuntu-24.04
    env:
      # Pull requests opened with the default token start no CI, so required
      # checks never run and auto-merge never fires. FORK_SYNC_TOKEN (contents,
      # pull requests, and workflows write on this fork) lets the sync land alone.
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
      HEAD_BRANCH: sync/upstream
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge upstream and open a pull request
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          behind=$(git rev-list --count "HEAD..upstream/main")
          if [ "$behind" -eq 0 ]; then
            echo "${BASE} already contains upstream/main."
            exit 0
          fi
          upstream=$(git rev-parse --short upstream/main)
          git switch -C "$HEAD_BRANCH"
          if ! git merge --no-ff --no-edit -m "Merge upstream/main through ${upstream}" upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            {
              echo "Upstream conflicts with ${BASE} in:"
              echo "$conflicts"
              echo "Merge by hand: git fetch upstream && git switch -c sync/upstream origin/${BASE} && git merge upstream/main"
            } >&2
            exit 1
          fi
          # Upstream runs some required jobs on Blacksmith, which the fork has no runners for: those
          # jobs would queue forever and block the merge, so they run on GitHub's runner here.
          sed -i -E 's/^( *runs-on: )blacksmith-[0-9]+vcpu-ubuntu-2404$/\1ubuntu-24.04/' .github/workflows/ci.yml
          if ! git diff --quiet; then
            git commit -qam "ci: run upstream's Blacksmith jobs on GitHub's runner, as the fork has none"
          fi
          git push --force origin "$HEAD_BRANCH"
          title="chore: merge upstream pingdotgg/t3code"
          body="Merges ${behind} upstream commits through pingdotgg/t3code@${upstream}. Merge with **Create a merge commit**, never squash."
          number=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE" --state open --json number --jq 'first | .number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
          else
            number=$(gh pr create --head "$HEAD_BRANCH" --base "$BASE" --title "$title" --body "$body" | sed 's|.*/||')
          fi
          gh pr merge "$number" --merge --auto
