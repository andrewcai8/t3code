# Temporary for the V2 sync PR: typecheck every package on its own so one run shows every layer's errors.
name: V2 typecheck each
on:
  pull_request:
jobs:
  typecheck:
    name: tsc ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: ["@t3tools/contracts", "@t3tools/shared", "@t3tools/client-runtime", "t3", "@t3tools/web", "@t3tools/mobile", "@t3tools/desktop", "scripts"]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - if: matrix.pkg == '@t3tools/desktop'
        run: vp run --filter @t3tools/desktop ensure:electron
      - if: matrix.pkg != 'scripts'
        run: vp run --filter "${{ matrix.pkg }}" typecheck
      - if: matrix.pkg == 'scripts'
        run: cd scripts && npx tsc --noEmit -p tsconfig.json
